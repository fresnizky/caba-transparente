# Catálogo de fuentes. Una entrada por fuente; `id` es la carpeta en data/raw/<id>/ y data/processed/<id>/
# y el archivo packages/scrapers/src/sources/<id>.ts.
# estado: relevado (visto, sin recolector) | activo | roto | pausado
# Detalle de cada una en docs/relevamiento-fuentes.md.

fuentes:
  - id: compras-bac
    nombre: Buenos Aires Compras (OCDS)
    organismo: Ministerio de Hacienda y Finanzas
    url: https://data.buenosaires.gob.ar/dataset/buenos-aires-compras
    formato: CSV (OCDS aplanado), JSON, XLSX
    frecuencia: trimestral
    datos_personales: nombre y CUIT de proveedores personas humanas; nombres de pacientes en títulos de compras de hospitales, que se ocultan por marcas (ver D-04)
    estado: activo

  - id: boletin-oficial
    nombre: Boletín Oficial de la Ciudad
    organismo: Secretaría Legal y Técnica
    url: https://api-restboletinoficial.buenosaires.gob.ar/api/doc/
    formato: API REST (JSON) y PDF
    frecuencia: diaria (días hábiles)
    datos_personales: CUIL y DNI en normas de personal, compras, nóminas y edictos; copia fiel, sumarios de edictos ocultos (ver D-04)
    estado: activo

  - id: autoridades-superiores
    nombre: Autoridades superiores y funcionarios
    organismo: Ministerio de Hacienda y Finanzas
    url: https://data.buenosaires.gob.ar/dataset/autoridades-superiores-funcionarios
    formato: CSV
    frecuencia: mensual según el catálogo (último archivo visto, 2024)
    datos_personales: CUIL, edad y mail (ver D-04)
    estado: relevado

  - id: sueldo-funcionarios
    nombre: Sueldos de autoridades superiores
    organismo: Ministerio de Hacienda y Finanzas
    url: https://data.buenosaires.gob.ar/dataset/sueldo-funcionarios
    formato: CSV
    frecuencia: trimestral según el catálogo (último archivo visto, 2024)
    estado: relevado

  - id: declaraciones-juradas
    nombre: Declaraciones juradas de funcionarios
    organismo: Secretaría Legal y Técnica
    url: https://data.buenosaires.gob.ar/dataset/declaraciones-juradas
    formato: CSV
    frecuencia: mensual según el catálogo (último período visto, 2022)
    estado: relevado

  - id: presupuesto-ejecutado
    nombre: Presupuesto ejecutado
    organismo: Ministerio de Hacienda y Finanzas
    url: https://data.buenosaires.gob.ar/dataset/presupuesto-ejecutado-2026
    formato: CSV
    frecuencia: trimestral
    estado: relevado

  - id: ba-obras
    nombre: Obras públicas (BA Obras)
    organismo: Secretaría Legal y Técnica
    url: https://data.buenosaires.gob.ar/dataset/ba-obras
    formato: CSV
    frecuencia: semestral
    estado: relevado

  - id: indec-ipc
    nombre: Índice de precios al consumidor (IPC)
    organismo: INDEC (Nación)
    url: https://www.indec.gob.ar/indec/web/Nivel4-Tema-3-5-31
    formato: CSV
    frecuencia: mensual
    estado: activo

  - id: bcra-cotizaciones
    nombre: Cotizaciones del dólar y el euro
    organismo: Banco Central de la República Argentina
    url: https://www.bcra.gob.ar/apis-banco-central/
    formato: API REST (JSON)
    frecuencia: diaria
    estado: activo
