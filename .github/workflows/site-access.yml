# Comprueba si los sitios de la Ciudad responden desde GitHub Actions (decisión abierta en docs/decisiones.md).
# Un pedido chico por sitio, en secuencia y con pausa. El resultado queda en el resumen del job y como artefacto.
# Se corre a mano: Actions → «Acceso a los sitios de la Ciudad» → Run workflow.

name: Acceso a los sitios de la Ciudad

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run probar-acceso --json acceso.json
      - uses: actions/upload-artifact@v4
        with:
          name: acceso-${{ github.run_id }}
          path: acceso.json
